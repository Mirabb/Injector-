<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injector de Arquivo</title>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            color: #fff;
            position: relative;
            overflow-x: hidden;
            background: linear-gradient(135deg, #2d0000 0%, #4a0000 50%, #1a0000 100%);
        }

        /* Fundo de Partículas */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #ff0000, #8b0000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(139, 0, 0, 0.5);
            letter-spacing: 1px;
        }

        .subtitle {
            color: #aa0000;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .status-card {
            background: rgba(139, 0, 0, 0.15);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 25px;
            border: 1px solid rgba(139, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(139, 0, 0, 0.15);
        }

        .status-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-text {
            font-size: 1.15rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #550000;
            transition: all 0.4s ease;
        }

        .status-indicator.on {
            background: #ff0000;
            box-shadow: 0 0 12px #ff0000, 0 0 24px #8b0000;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .toggle-btn {
            width: 75px;
            height: 38px;
            background: #330000;
            border-radius: 19px;
            position: relative;
            cursor: pointer;
            transition: all 0.4s ease;
            border: 1px solid #550000;
        }

        .toggle-btn.on {
            background: linear-gradient(90deg, #8b0000, #ff0000);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            border-color: #ff0000;
        }

        .toggle-circle {
            width: 32px;
            height: 32px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .toggle-btn.on .toggle-circle {
            left: 40px;
        }

        .upload-card {
            background: rgba(139, 0, 0, 0.15);
            border-radius: 16px;
            padding: 35px 25px;
            border: 1px solid rgba(139, 0, 0, 0.4);
            text-align: center;
            margin-bottom: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(139, 0, 0, 0.15);
        }

        .upload-card h3 {
            color: #ff4444;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .upload-card p {
            color: #885555;
            font-size: 0.88rem;
            margin-bottom: 20px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-btn {
            background: linear-gradient(90deg, #8b0000, #ff0000);
            padding: 14px 35px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.3);
        }

        .file-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.4);
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .file-name {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #885555;
        }

        .preview-card {
            background: rgba(139, 0, 0, 0.15);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(139, 0, 0, 0.4);
            display: none;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(139, 0, 0, 0.15);
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .preview-header h4 {
            color: #ff4444;
            font-size: 1rem;
        }

        .clear-btn {
            background: rgba(255, 0, 0, 0.15);
            color: #ff6666;
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.25s ease;
        }

        .clear-btn:hover {
            background: rgba(255, 0, 0, 0.3);
            border-color: #ff0000;
        }

        pre {
            background: rgba(0, 0, 0, 0.4);
            padding: 18px;
            border-radius: 10px;
            overflow-x: auto;
            max-height: 380px;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #e0c0c0;
            border: 1px solid rgba(139, 0, 0, 0.2);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #663333;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <!-- Fundo de Partículas -->
    <div id="particles-js"></div>

    <div class="container">
        <header>
            <h1>🩸 Injector DE ARQUIVOS</h1>
            <p class="subtitle">Sistema de Visualização • Status Online</p>
        </header>

        <!-- Status Online -->
        <div class="status-card">
            <div class="status-wrapper">
                <span class="status-text">
                    <span class="status-indicator" id="statusDot"></span>
                    <span id="statusLabel">OFFLINE</span>
                </span>
                <div class="toggle-btn" id="toggleBtn" onclick="toggleStatus()">
                    <div class="toggle-circle"></div>
                </div>
            </div>
        </div>

        <!-- Selecionar Arquivo -->
        <div class="upload-card">
            <h3>📎 Carregar Arquivo</h3>
            <p>Suporta: .txt, .json, .md, .cfg</p>
            
            <div class="file-input-wrapper">
                <button class="file-btn">ESCOLHER ARQUIVO</button>
                <input type="file" id="fileInput" accept=".txt,.json,.md,.cfg" onchange="handleFileSelect(event)">
            </div>
            
            <div class="file-name" id="fileName">Nenhum arquivo selecionado</div>
        </div>

        <!-- Visualização do Arquivo -->
        <div class="preview-card" id="previewCard">
            <div class="preview-header">
                <h4 id="previewName">📄 Conteúdo do Arquivo</h4>
                <button class="clear-btn" onclick="clearFile()">✕ Limpar</button>
            </div>
            <pre id="fileContent"></pre>
        </div>

        <footer>
            Leitor de Arquivos • Sistema Online • Versão 1.0
        </footer>
    </div>

    <script>
        // Inicializar Partículas
        document.addEventListener('DOMContentLoaded', function() {
            if (window.particlesJS) {
                particlesJS('particles-js', {
                    particles: {
                        number: { value: 80, density: { enable: true, value_area: 800 } },
                        color: { value: ['#ff0000', '#8b0000', '#cc0000'] },
                        shape: { type: 'circle' },
                        opacity: { value: 0.6, random: true },
                        size: { value: 3, random: true },
                        line_linked: {
                            enable: true,
                            distance: 150,
                            color: '#660000',
                            opacity: 0.4,
                            width: 1
                        },
                        move: {
                            enable: true,
                            speed: 1.5,
                            direction: 'none',
                            random: true,
                            straight: false,
                            out_mode: 'out',
                            bounce: false
                        }
                    },
                    interactivity: {
                        detect_on: 'canvas',
                        events: {
                            onhover: { enable: true, mode: 'grab' },
                            onclick: { enable: true, mode: 'push' },
                            resize: true
                        },
                        modes: {
                            grab: { distance: 140, line_linked: { opacity: 0.8 } }
                        }
                    },
                    retina_detect: true
                });
            }
        });

        // Controle de Status Online
        let isOnline = false;

        function toggleStatus() {
            isOnline = !isOnline;
            const btn = document.getElementById('toggleBtn');
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusLabel');
            
            if (isOnline) {
                btn.classList.add('on');
                dot.classList.add('on');
                label.textContent = 'ONLINE';
                label.style.color = '#ff4444';
            } else {
                btn.classList.remove('on');
                dot.classList.remove('on');
                label.textContent = 'OFFLINE';
                label.style.color = '#885555';
            }
        }

        // Injector de Arquivo
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('fileName').innerHTML = '✅ <strong>' + file.name + '</strong>';
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                document.getElementById('previewCard').style.display = 'block';
                document.getElementById('previewName').textContent = '📄 ' + file.name;
                document.getElementById('fileContent').textContent = content;
            };
            reader.readAsText(file);
        }

        // Limpar Arquivo
        function clearFile() {
            document.getElementById('fileInput').value = '';
            document.getElementById('fileName').textContent = 'Nenhum arquivo selecionado';
            document.getElementById('previewCard').style.display = 'none';
            document.getElementById('fileContent').textContent = '';
        }
    </script>
</body>
</html>
